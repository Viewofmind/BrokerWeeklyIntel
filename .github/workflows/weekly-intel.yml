name: BrokerWeeklyIntel - Weekly Analysis

on:
  schedule:
    # Every Sunday at 08:30 IST (03:00 UTC)
    - cron: '30 3 * * 0'
  workflow_dispatch:   # Manual trigger from GitHub UI for testing

jobs:
  run-weekly-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full weekly intelligence pipeline
        working-directory: backend
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Add other secrets as needed
          DATABASE_URL: sqlite:///./data/broker_intel.db
          WEEKLY_ANALYSIS_DAY: Sunday
          TIMEZONE: Asia/Kolkata
        run: |
          python -m scripts.run_weekly

      - name: Commit generated reports and snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/historical/ || true
          git commit -m "chore: weekly intel report $(date +%Y-W%W)" || echo "No changes to commit"
          git push

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: broker-weekly-intel-${{ github.run_number }}
          path: |
            reports/
            data/historical/latest.json
          retention-days: 90
