[project]
name = "brokerweeklyintel-backend"
version = "0.1.0"
description = "FastAPI backend for BrokerWeeklyIntel - Weekly Competitor Intelligence for Indian stock brokers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Gunjan Chokshi"}
]
keywords = ["fintech", "broker", "competitor-intelligence", "sentiment-analysis", "india", "stock-market", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = []  # Managed via requirements.txt for simplicity during early development

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "apify_client.*",
    "praw.*",
    "reportlab.*",
]
ignore_missing_imports = true
